# Reverse proxy for production: HTTPS termination, same origin for the web app (/) and the API (/api),
# so the refresh cookie stays first-party. The default HTTPS server serves every hostname that
# does not have its own per-domain config (deploy/nginx/sites/*.conf). Those per-domain files are
# written by the certbot script when a new Let's Encrypt certificate is issued.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 12m;            # imports (10 Mo) and scanned documents (5 Mo)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Basic protection against floods (the API also limits sign-in attempts per account and IP).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  upstream web { server frontend:3000; }
  upstream api { server backend:4000; }

  # Shared location blocks reused by the default server and by every per-domain server.
  # Nginx cannot "include" partial server blocks without duplicating the directives below, but it
  # can include a full snippet; sites/*.conf below bring in both the server header and the proxy
  # routing in one file.

  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # Default HTTPS server (fallback for hosts without their own certificate): uses the self-signed
  # cert mounted at deploy/certs so nginx keeps serving while a new domain is being verified.
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
      include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
      include /etc/nginx/proxy_params.conf;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://web;
      include /etc/nginx/proxy_params.conf;
    }
  }

  # Per-domain servers written by deploy/certbot/renew.sh: one <host>.conf per custom domain,
  # each listens on 443 with its own Let's Encrypt certificate.
  include /etc/nginx/sites/*.conf;
}

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-schooladmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SchoolAdmin123!}
      POSTGRES_DB: ${DB_NAME:-school_erp}
    # No host port: avoids clashes with other local Postgres instances.
    # Access: docker compose exec postgres psql -U schooladmin school_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-schooladmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # OpenLDAP (Authentication)
  openldap:
    image: osixia/openldap:1.5.0
    container_name: school-ldap
    environment:
      LDAP_ORGANISATION: "School Network"
      LDAP_DOMAIN: school.local
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:-LdapAdmin123!}
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapwhoami", "-H", "ldap://localhost", "-D", "cn=admin,dc=school,dc=local", "-w", "${LDAP_PASSWORD:-LdapAdmin123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # MailHog (Email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: school-mailhog
    ports:
      - "8025:8025"    # Web UI (SMTP 1025 reachable inside the Docker network only)
    networks:
      - school-network

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-schooladmin}:${DB_PASSWORD:-SchoolAdmin123!}@postgres:5432/${DB_NAME:-school_erp}
      REDIS_URL: redis://redis:6379
      LDAP_URL: ldap://openldap:389
      LDAP_BASE_DN: dc=school,dc=local
      LDAP_ADMIN_DN: cn=admin,dc=school,dc=local
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:-LdapAdmin123!}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASS: ""
      API_URL: http://localhost:4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:1300}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # `nest start --watch` uses the TypeScript watcher: file events do not cross Windows bind mounts
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      SEED_ON_EMPTY_DB: ${SEED_ON_EMPTY_DB:-true}
      UPLOAD_DIR: /app/uploads
      # Optional AI analysis of imported timetables (Claude). Empty = local extraction only.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TIMETABLE_AI_MODEL: ${TIMETABLE_AI_MODEL:-claude-opus-5}
      # Assistant (Dify): chatbot and agent apps, cloud.dify.ai or self-hosted. Empty keys = assistant disabled.
      DIFY_API_URL: ${DIFY_API_URL:-https://api.dify.ai/v1}
      DIFY_CHATBOT_API_KEY: ${DIFY_CHATBOT_API_KEY:-}
      DIFY_AGENT_API_KEY: ${DIFY_AGENT_API_KEY:-}
      # Public URL of this API as seen by Dify, for the agent's tools (e.g. an https tunnel to port 4000)
      ASSISTANT_TOOLS_PUBLIC_URL: ${ASSISTANT_TOOLS_PUBLIC_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma   # schema + seed editable without rebuilding the image
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/uploads   # showcase images + OCR language cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s   # first boot: npm sync + db push + seed + compile
    networks:
      - school-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-1300}:3000"   # host port 1300 -> next dev listens on 3000 in the container
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - school-network

  # NGINX Reverse Proxy (Optional - for production-like setup)
  # Disabled by default due to Windows file mount issues
  # Enable with: docker-compose --profile nginx up -d
  nginx:
    image: nginx:alpine
    container_name: school-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - school-network
    profiles:
      - nginx

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ldap_data:
  ldap_config:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:

networks:
  school-network:
    driver: bridge

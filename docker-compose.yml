services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-schooladmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SchoolAdmin123!}
      POSTGRES_DB: ${DB_NAME:-school_erp}
    # No host port: avoids clashes with other local Postgres instances.
    # Access: docker compose exec postgres psql -U schooladmin school_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-schooladmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  # MailHog: captures outgoing e-mails in development (password reset, notifications) — http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: school-mailhog
    ports:
      - "8025:8025"    # Web UI (SMTP 1025 reachable inside the Docker network only)
    networks:
      - school-network

  # Adminer: lightweight DB inspection tool for developers. Dev only (absent from
  # docker-compose.prod.yml). Reachable at http://localhost:8080 once started with
  # `docker compose --profile tools up adminer` so it does not take resources by default.
  adminer:
    image: adminer:4
    container_name: school-adminer
    profiles:
      - tools
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-network

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-schooladmin}:${DB_PASSWORD:-SchoolAdmin123!}@postgres:5432/${DB_NAME:-school_erp}
      REDIS_URL: redis://redis:6379
      # Development only: production (docker-compose.prod.yml) requires real secrets.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-not-for-production}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASS: ""
      MAIL_FROM: School ERP <no-reply@school.local>
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-ZGV2LW9ubHktZGF0YS1lbmNyeXB0aW9uLWtleS0zMiE=}
      API_URL: http://localhost:4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:1300}
      # SaaS portal hostname and the suffix under which schools get a free subdomain
      # (<slug>.<suffix>). Leave empty in dev to fall back on localhost.
      PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:-}
      PLATFORM_SUBDOMAIN_SUFFIX: ${PLATFORM_SUBDOMAIN_SUFFIX:-}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # `nest start --watch` uses the TypeScript watcher: file events do not cross Windows bind mounts
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      SEED_ON_EMPTY_DB: ${SEED_ON_EMPTY_DB:-true}
      UPLOAD_DIR: /app/uploads
      # Optional AI analysis of imported timetables (Claude). Empty = local extraction only.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TIMETABLE_AI_MODEL: ${TIMETABLE_AI_MODEL:-claude-opus-5}
      # Assistant (Dify): chatbot and agent apps, cloud.dify.ai or self-hosted. Empty keys = assistant disabled.
      DIFY_API_URL: ${DIFY_API_URL:-https://api.dify.ai/v1}
      DIFY_CHATBOT_API_KEY: ${DIFY_CHATBOT_API_KEY:-}
      DIFY_AGENT_API_KEY: ${DIFY_AGENT_API_KEY:-}
      # Public URL of this API as seen by Dify, for the agent's tools (e.g. an https tunnel to port 4000)
      ASSISTANT_TOOLS_PUBLIC_URL: ${ASSISTANT_TOOLS_PUBLIC_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma   # schema + seed editable without rebuilding the image
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/uploads   # showcase images + OCR language cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s   # first boot: npm sync + db push + seed + compile
    networks:
      - school-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_DEMO_ACCOUNTS: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-1300}:3000"   # host port 1300 -> next dev listens on 3000 in the container
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - school-network

  # Production-like stack: see docker-compose.prod.yml (nginx + HTTPS, backups, built images).

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:

networks:
  school-network:
    driver: bridge

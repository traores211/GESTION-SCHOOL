<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors connexion · School ERP</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fffdf8; color: #1b1916; line-height: 1.55; }
      main { max-width: 420px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: #5c5850; }
      a, button { display: inline-block; padding: 12px 20px; border-radius: 8px; border: 0; background: #f77f00; color: #1b1916; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #1b1916; color: #f3efe6; } p { color: #b5afa3; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Cette page n'a pas encore été ouverte sur cet appareil. Les pages déjà consultées restent accessibles ; l'appel pris sans réseau est envoyé automatiquement au retour de la connexion.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
